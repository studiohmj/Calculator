<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수익률 계산기 — 회룡역점</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #f3f3f6;
  --surf:    #ffffff;
  --surf2:   #ededf1;
  --bd:      #e0e0e8;
  --bd2:     #c4c4d0;
  --t1:      #0c0c14;
  --t2:      #1c1c30;
  --t3:      #50506c;
  --t4:      #9090aa;
  --blue:    #1d4ed8;
  --blue-bg: #dbeafe;
  --green:   #15803d;
  --amber:   #92400e;
  --yellow:  #ca8a04;
  --red:     #b91c1c;
  --bar:     #e0e0e8;
  --sh1: 0 1px 3px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.04);
  --sh2: 0 4px 16px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
}
[data-theme="dark"] {
  --bg:      #0e0e13;
  --surf:    #18181f;
  --surf2:   #222230;
  --bd:      #2e2e40;
  --bd2:     #42425a;
  --t1:      #ffffff;
  --t2:      #ffffff;
  --t3:      #e0e0f4;
  --t4:      #c8c8e0;
  --blue:    #60a5fa;
  --blue-bg: #1a2a48;
  --green:   #4ade80;
  --amber:   #fbbf24;
  --yellow:  #fde047;
  --red:     #f87171;
  --bar:     #2e2e40;
  --sh1: 0 1px 3px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
  --sh2: 0 4px 16px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
}

body {
  font-family: 'Pretendard Variable', Pretendard, sans-serif;
  background: var(--bg);
  color: var(--t1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 48px 20px 80px;
}

.header { margin-bottom: 32px; }
.header-topbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  margin-bottom: 14px;
}
.header-store {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  color: var(--t4);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 10px;
}
.theme-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 13px;
  border-radius: 99px;
  border: 1px solid var(--bd2);
  background: var(--surf);
  color: var(--t3);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  box-shadow: var(--sh1);
  white-space: nowrap;
  flex-shrink: 0;
}
.theme-btn:hover { color: var(--t1); border-color: var(--t3); }
.header-title {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -.03em;
  color: var(--t1);
  line-height: 1;
  text-align: center;
}
.header-sub {
  font-size: 13px;
  font-weight: 400;
  color: var(--t4);
  text-align: center;
  margin-top: 8px;
}

.input-grid {
  display: grid;
  grid-template-columns: 3fr 2fr;
  gap: 10px;
  margin-bottom: 10px;
}
.input-card {
  background: var(--surf);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 22px 22px 18px;
  box-shadow: var(--sh1);
  transition: border-color .15s, box-shadow .15s;
}
.input-card:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-bg), var(--sh1);
}
.ic-lbl {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--t4);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.ic-row { display: flex; align-items: baseline; gap: 4px; }
.ic-row input {
  background: transparent;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -.03em;
  color: var(--t1);
  width: 100%;
  min-width: 0;
  -moz-appearance: textfield;
}
.ic-row input::-webkit-outer-spin-button,
.ic-row input::-webkit-inner-spin-button { -webkit-appearance: none; }
.ic-row input::placeholder { color: var(--bd2); }
.ic-unit { font-size: 13px; font-weight: 600; color: var(--t4); white-space: nowrap; flex-shrink: 0; }
.ic-hint { font-size: 11px; font-weight: 400; color: var(--t4); margin-top: 6px; }
.ic-hint strong { font-weight: 700; color: var(--t3); }

.chip-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
.chip {
  background: var(--surf);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: var(--sh1);
}
.chip-lbl { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--t4); text-transform: uppercase; margin-bottom: 6px; }
.chip-num { font-size: 20px; font-weight: 800; letter-spacing: -.02em; color: var(--blue); white-space: nowrap; line-height: 1.1; }
.chip-sub { font-size: 10px; font-weight: 400; color: var(--t4); margin-top: 4px; line-height: 1.4; }

.result-board {
  background: var(--surf);
  border: 1px solid var(--bd);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--sh2);
  margin-bottom: 10px;
  position: relative;
}
.result-board::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--bar); transition: background .3s;
}
.rb-top { display: grid; grid-template-columns: 1fr 1fr; }
.rb-col { padding: 26px 24px 22px; }
.rb-col + .rb-col { border-left: 1px solid var(--bd); }
.rb-lbl { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--t4); text-transform: uppercase; margin-bottom: 10px; }
.rb-profit { font-size: 34px; font-weight: 800; letter-spacing: -.035em; line-height: 1; color: var(--t4); white-space: nowrap; }
.rb-rate { font-size: 12px; font-weight: 700; color: var(--t4); margin-top: 8px; }
.rb-detail { display: flex; flex-direction: column; gap: 7px; }
.rb-detail-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rb-dk { font-size: 12px; font-weight: 500; color: var(--t3); }
.rb-dv { font-size: 13px; font-weight: 700; color: var(--t2); white-space: nowrap; }
.rb-gauge { border-top: 1px solid var(--bd); padding: 18px 24px 22px; }
.rb-gauge-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.rb-gauge-lbl { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--t4); text-transform: uppercase; }
.rb-gauge-num { font-size: 14px; font-weight: 800; color: var(--t4); }
.gauge-track { height: 7px; background: var(--surf2); border-radius: 99px; overflow: hidden; position: relative; }
.gauge-zone { position: absolute; top: 0; bottom: 0; left: 60%; width: 8%; background: rgba(0,0,0,.08); }
[data-theme="dark"] .gauge-zone { background: rgba(255,255,255,.12); }
.gauge-fill { height: 100%; border-radius: 99px; background: var(--bd2); transition: width .35s ease, background .3s; }
.gauge-ticks { display: flex; justify-content: space-between; margin-top: 5px; }
.gauge-ticks span { font-size: 10px; font-weight: 500; color: var(--t4); }
.gauge-status { font-size: 13px; font-weight: 700; color: var(--t4); margin-top: 10px; }

.acc { background: var(--surf); border: 1px solid var(--bd); border-radius: 16px; overflow: hidden; box-shadow: var(--sh1); margin-bottom: 10px; }
.acc-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; cursor: pointer; user-select: none; transition: background .12s; gap: 12px; }
.acc-head:hover { background: var(--surf2); }
.acc-head-info { min-width: 0; }
.acc-head-title { font-size: 14px; font-weight: 700; color: var(--t2); letter-spacing: -.01em; }
.acc-head-sub   { font-size: 11px; font-weight: 400; color: var(--t4); margin-top: 3px; }
.acc-arrow { font-size: 10px; color: var(--t4); transition: transform .2s; flex-shrink: 0; }
.acc.open .acc-arrow { transform: rotate(180deg); }
.acc-body { display: none; border-top: 1px solid var(--bd); }
.acc.open .acc-body { display: block; }

.fi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--bd); }
.fi-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; background: var(--surf); }
.fi-row.full { grid-column: 1 / -1; }
.fi-row.off .fi-key { opacity: .35; }
.fi-row.off .fi-inp { opacity: .25; pointer-events: none; }
.fi-key { font-size: 13px; font-weight: 600; color: var(--t2); }
.fi-key-sub { font-size: 10px; font-weight: 400; color: var(--t4); margin-top: 2px; }
.fi-rhs { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.fi-inp {
  background: var(--surf2);
  border: 1px solid var(--bd2);
  border-radius: 8px;
  color: var(--t1);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  padding: 6px 9px;
  width: 70px;
  text-align: right;
  outline: none;
  transition: border-color .15s;
  -moz-appearance: textfield;
}
.fi-inp::-webkit-outer-spin-button,
.fi-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
.fi-inp:focus { border-color: var(--blue); background: var(--surf); }
.fi-inp:disabled { color: var(--t4); cursor: default; font-weight: 400; }
.fi-unit { font-size: 11px; font-weight: 500; color: var(--t4); }

.season-btns { display: flex; gap: 6px; }
.season-btn { padding: 5px 11px; border-radius: 99px; border: 1px solid var(--bd2); background: var(--surf2); color: var(--t3); font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
.season-btn.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }

.sw { position: relative; display: inline-block; width: 32px; height: 18px; flex-shrink: 0; }
.sw input { opacity: 0; width: 0; height: 0; }
.sw-track { position: absolute; inset: 0; background: var(--bd2); border-radius: 99px; cursor: pointer; transition: background .2s; }
.sw-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw input:checked + .sw-track { background: var(--blue); }
.sw input:checked + .sw-track::after { transform: translateX(14px); }

.royalty { background: var(--surf); border: 1px solid var(--bd); border-radius: 16px; overflow: hidden; box-shadow: var(--sh1); }
.royalty-inner { display: grid; grid-template-columns: 1fr 1px 1fr; align-items: stretch; }
.ry-col { padding: 18px 22px; }
.ry-div { background: var(--bd); }
.ry-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--blue); background: var(--blue-bg); border: 1px solid var(--blue); border-radius: 4px; padding: 2px 6px; }
.ry-lbl { font-size: 12px; font-weight: 600; color: var(--t2); margin: 8px 0 8px; }

.cb { color: var(--blue)   !important; }
.cg { color: var(--green)  !important; }
.ca { color: var(--amber)  !important; }
.cr { color: var(--red)    !important; }
.cy { color: var(--yellow) !important; }
.cm { color: var(--t4)     !important; }

@media (max-width: 500px) {
  .wrap { padding: 28px 14px 60px; }
  .header-topbar { margin-bottom: 10px; }
  .header-title { font-size: 22px; }
  .header-store { font-size: 10px; margin-bottom: 8px; }
  .input-grid { grid-template-columns: 1fr; }
  .ic-row input { font-size: 28px; }
  .rb-top { grid-template-columns: 1fr; }
  .rb-col + .rb-col { border-left: none; border-top: 1px solid var(--bd); }
  .rb-profit { font-size: 28px; }
  .fi-grid { grid-template-columns: 1fr; }
  .fi-row.full { grid-column: 1; }
  .chip-num { font-size: 17px; }
  .fi-rhs { flex-wrap: wrap; justify-content: flex-end; }
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-topbar">
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">다크 모드</span>
      </button>
    </div>
    <div class="header-store">제로스토어 회룡역점</div>
    <div class="header-title">수익률 계산기</div>
    <div class="header-sub">무인 24시간 운영 · 월별 수익 분석</div>
  </div>

  <div class="input-grid">
    <div class="input-card">
      <span class="ic-lbl">월 총매출</span>
      <div class="ic-row">
        <input type="number" id="sales" placeholder="0" min="0">
        <span class="ic-unit">만원</span>
      </div>
      <div class="ic-hint">세금계산서 기준</div>
    </div>
    <div class="input-card">
      <span class="ic-lbl">원가율</span>
      <div class="ic-row">
        <input type="number" id="costRate" value="66" min="0" max="100" step="0.1">
        <span class="ic-unit">%</span>
      </div>
      <div class="ic-hint">마진율 <strong id="marginHint">—</strong></div>
    </div>
  </div>

  <div class="chip-grid">
    <div class="chip">
      <div class="chip-lbl">일 고정비</div>
      <div class="chip-num" id="beDaily">—</div>
      <div class="chip-sub">매일 나가는 고정 비용</div>
    </div>
    <div class="chip">
      <div class="chip-lbl">손익분기 일 매출</div>
      <div class="chip-num" id="beBreak">—</div>
      <div class="chip-sub" id="beBreakSub">원가율 입력 시 계산</div>
    </div>
  </div>

  <div class="result-board" id="resultBoard">
    <div class="rb-top">
      <div class="rb-col">
        <div class="rb-lbl">월 순이익</div>
        <div class="rb-profit cm" id="rProfit">—</div>
        <div class="rb-rate cm" id="rRate">매출을 입력하세요</div>
      </div>
      <div class="rb-col">
        <div class="rb-lbl">비용 내역</div>
        <div class="rb-detail">
          <div class="rb-detail-row"><span class="rb-dk">원가</span><span class="rb-dv" id="rCogs">—</span></div>
          <div class="rb-detail-row"><span class="rb-dk">고정비</span><span class="rb-dv" id="rFixed">—</span></div>
          <div class="rb-detail-row"><span class="rb-dk">총매출</span><span class="rb-dv" id="rSales">—</span></div>
        </div>
      </div>
    </div>
    <div class="rb-gauge">
      <div class="rb-gauge-head">
        <span class="rb-gauge-lbl">수익률</span>
        <span class="rb-gauge-num cm" id="rRateNum">—</span>
      </div>
      <div class="gauge-track">
        <div class="gauge-zone"></div>
        <div class="gauge-fill" id="gaugeFill" style="width:0%"></div>
      </div>
      <div class="gauge-ticks">
        <span>0%</span>
        <span style="margin-left:46%">30%</span>
        <span>34%</span>
        <span>50%</span>
      </div>
      <div class="gauge-status cm" id="statusMsg"></div>
    </div>
  </div>

  <div class="acc open" id="fixedAcc">
    <div class="acc-head" onclick="$('fixedAcc').classList.toggle('open')">
      <div class="acc-head-info">
        <div class="acc-head-title">고정 지출 내역</div>
        <div class="acc-head-sub" id="fixedSub">클릭해서 확인 및 수정</div>
      </div>
      <span class="acc-arrow">▼</span>
    </div>
    <div class="acc-body">
      <div class="fi-grid">

        <div class="fi-row">
          <div>
            <div class="fi-key">임대료</div>
            <div class="fi-key-sub">부가세(25만원) 포함</div>
          </div>
          <div class="fi-rhs">
            <input class="fi-inp" type="number" id="rent" value="275" min="0">
            <span class="fi-unit">만</span>
          </div>
        </div>

        <div class="fi-row">
          <div class="fi-key">인터넷비</div>
          <div class="fi-rhs">
            <input class="fi-inp" type="number" id="internet" value="1.2" min="0" step="0.1">
            <span class="fi-unit">만</span>
          </div>
        </div>

        <div class="fi-row full">
          <div class="fi-key">관리비 <span style="font-size:10px;font-weight:400;color:var(--t4)">(전기 포함)</span></div>
          <div class="fi-rhs">
            <input class="fi-inp" type="number" id="electric" placeholder="0" min="0">
            <span class="fi-unit">만</span>
          </div>
        </div>

        <div class="fi-row" id="row-insurance">
          <div class="fi-key">보험</div>
          <div class="fi-rhs">
            <label class="sw">
              <input type="checkbox" id="tog-insurance" checked onchange="toggleRow('insurance')">
              <span class="sw-track"></span>
            </label>
            <input class="fi-inp" type="number" id="insurance" placeholder="0" min="0" step="0.1">
            <span class="fi-unit">만</span>
          </div>
        </div>

        <div class="fi-row" id="row-tax_fee">
          <div class="fi-key">세무비</div>
          <div class="fi-rhs">
            <label class="sw">
              <input type="checkbox" id="tog-tax_fee" checked onchange="toggleRow('tax_fee')">
              <span class="sw-track"></span>
            </label>
            <input class="fi-inp" type="number" id="tax_fee" placeholder="0" min="0" step="0.1">
            <span class="fi-unit">만</span>
          </div>
        </div>

        <div class="fi-row" id="row-loan">
          <div class="fi-key">대출 이자</div>
          <div class="fi-rhs">
            <label class="sw">
              <input type="checkbox" id="tog-loan" checked onchange="toggleRow('loan')">
              <span class="sw-track"></span>
            </label>
            <input class="fi-inp" type="number" id="loan" placeholder="0" min="0" step="0.1">
            <span class="fi-unit">만</span>
          </div>
        </div>

        <div class="fi-row" id="row-etc">
          <div class="fi-key">소모품 / 기타</div>
          <div class="fi-rhs">
            <label class="sw">
              <input type="checkbox" id="tog-etc" checked onchange="toggleRow('etc')">
              <span class="sw-track"></span>
            </label>
            <input class="fi-inp" type="number" id="etc" placeholder="0" min="0" step="0.1">
            <span class="fi-unit">만</span>
          </div>
        </div>

      </div>
    </div>
  </div>


</div>
<script>
const $ = id => document.getElementById(id);
const v  = id => parseFloat($(id).value) || 0;
let dk = false;

function toggleTheme() {
  dk = !dk;
  document.documentElement.setAttribute('data-theme', dk ? 'dark' : 'light');
  $('themeIcon').textContent  = dk ? '☀️' : '🌙';
  $('themeLabel').textContent = dk ? '라이트 모드' : '다크 모드';
  calc();
}

function toggleRow(key) {
  const on = $('tog-' + key).checked;
  const row = $('row-' + key);
  if (row) row.classList.toggle('off', !on);
  calc();
}

function fmt(n, sign) {
  const abs = Math.abs(n), pre = sign && n < 0 ? '▼ ' : '';
  if (abs >= 10000) return pre + (abs/10000).toFixed(2) + '억원';
  return pre + abs.toLocaleString('ko-KR', {maximumFractionDigits:1}) + '만원';
}
function fmtS(n) {
  const abs = Math.abs(n);
  if (abs >= 10000) return (abs/10000).toFixed(2) + '억';
  return abs.toLocaleString('ko-KR', {maximumFractionDigits:0}) + '만';
}
function setBar(c) {
  $('resultBoard').style.setProperty('--bar', c || 'var(--bd)');
}

function calc() {
  const sales = v('sales'), cr = v('costRate');

  $('marginHint').textContent = cr > 0 ? (100 - cr).toFixed(1) + '%' : '—';

  const useIns  = $('tog-insurance').checked;
  const useEtc  = $('tog-etc').checked;
  const useTax  = $('tog-tax_fee').checked;
  const useLoan = $('tog-loan').checked;

  const fixedBase = v('rent') + v('electric') + v('internet') +
                    (useIns  ? v('insurance') : 0) +
                    (useTax  ? v('tax_fee')   : 0) +
                    (useLoan ? v('loan')       : 0) +
                    (useEtc  ? v('etc')        : 0);

  $('fixedSub').textContent = '합계 ' + fmtS(fixedBase) + '원 · 클릭해서 확인 및 수정';
  $('beDaily').textContent  = fmtS(fixedBase / 30) + '원';

  const margin = 1 - cr/100;
  if (cr > 0 && margin > 0.01) {
    const mBE = fixedBase / margin;
    $('beBreak').textContent    = fmtS(mBE / 30) + '원';
    $('beBreakSub').textContent = '월 ' + fmtS(mBE) + '원 이상이면 손해 없음';
  } else {
    $('beBreak').textContent    = '—';
    $('beBreakSub').textContent = '원가율 입력 시 계산';
  }

  if (sales <= 0) {
    $('rProfit').textContent = '—'; $('rProfit').className = 'rb-profit cm';
    $('rRate').textContent   = '매출을 입력하세요'; $('rRate').className = 'rb-rate cm';
    $('rCogs').textContent   = '—'; $('rFixed').textContent = '—'; $('rSales').textContent = '—';
    $('rRateNum').textContent = '—'; $('rRateNum').style.color = '';
    $('statusMsg').textContent = ''; $('statusMsg').style.color = '';
    $('gaugeFill').style.cssText = 'width:0%;background:var(--bd2)';
    setBar(null); return;
  }

  const cogs   = sales * cr / 100;
  const profit = sales - cogs - fixedBase;
  const rate   = (profit / sales) * 100;
  const gw     = Math.min(Math.max(rate/50*100, 0), 100);

  $('rCogs').textContent   = cogs > 0 ? fmt(cogs) : '—';
  $('rFixed').textContent  = fmt(fixedBase);
  $('rSales').textContent  = fmt(sales);
  $('rProfit').textContent = fmt(profit, true);

  let cls, color, msg;
  if      (profit >= 250) { cls='cb'; color=dk?'#60a5fa':'#1d4ed8'; msg='순이익 '+fmt(profit)+' — 수익률이 너무 좋습니다'; }
  else if (profit >= 150) { cls='cg'; color=dk?'#4ade80':'#15803d'; msg='순이익 '+fmt(profit)+' — 수익률이 괜찮은 편입니다'; }
  else if (profit >= 100) { cls='cy'; color=dk?'#fde047':'#ca8a04'; msg='순이익 '+fmt(profit)+' — 비용 항목 점검 필요'; }
  else if (profit >=  50) { cls='ca'; color=dk?'#fbbf24':'#92400e'; msg='순이익 '+fmt(profit)+' — 수익률 낮음, 구조 검토 필요'; }
  else if (profit >=   0) { cls='cr'; color=dk?'#f87171':'#b91c1c'; msg='순이익 '+fmt(profit)+' — 수익 위험 구간'; }
  else                     { cls='cr'; color=dk?'#f87171':'#b91c1c'; msg='순이익 '+fmt(profit,true)+' — 적자 (비용이 매출 초과)'; }

  $('rProfit').className     = 'rb-profit ' + cls;
  $('rRate').textContent     = '수익률 ' + rate.toFixed(1) + '%';
  $('rRate').className       = 'rb-rate ' + cls;
  $('rRateNum').textContent  = rate.toFixed(1) + '%';
  $('rRateNum').style.color  = color;
  $('gaugeFill').style.width = gw + '%';
  $('gaugeFill').style.background = color;
  $('statusMsg').textContent = msg;
  $('statusMsg').style.color = color;
  $('statusMsg').className   = 'gauge-status';
  setBar(color);
}

document.querySelectorAll('input:not([disabled])').forEach(i => i.addEventListener('input', calc));
calc();
</script>
</body>
</html>
